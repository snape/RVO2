  cmake-windows:
    name: cmake windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleInstalled = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              if (-not $moduleInstalled) {
                Install-Module -Force -Name Microsoft.WinGet.Client
                $moduleInstalled = $true
              }
              $package = Get-WinGetPackage -Id Git.Git `
                -MatchOption Equals -ErrorAction SilentlyContinue
              if (-not $package) {
                $result = Install-WinGetPackage -Id Git.Git `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet install failed: $($result.Status)\"
                }
              } elseif ($package.IsUpdateAvailable) {
                $result = Update-WinGetPackage -Id Git.Git `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet update failed: $($result.Status)\"
                }
              }
              $package = Get-WinGetPackage -Id Kitware.CMake `
                -MatchOption Equals -ErrorAction SilentlyContinue
              if (-not $package) {
                $result = Install-WinGetPackage -Id Kitware.CMake `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet install failed: $($result.Status)\"
                }
              } elseif ($package.IsUpdateAvailable) {
                $result = Update-WinGetPackage -Id Kitware.CMake `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet update failed: $($result.Status)\"
                }
              }
              break
            } catch {
              if ($i -eq 3) { throw }
              if ($moduleInstalled) {
                try { Repair-WinGetPackageManager -Force -Latest } catch {}
              }
              Start-Sleep -Seconds 15
            }
          }
          Add-Content $env:GITHUB_PATH (
            [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + `
            [System.Environment]::GetEnvironmentVariable("Path", "User"))
        shell: pwsh
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: build test package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          mkdir _build
          cd _build
          cmake `
            -DBUILD_DOCUMENTATION:BOOL=ON `
            -DBUILD_TESTING:BOOL=ON `
            -DCMAKE_INSTALL_PREFIX:PATH=install `
            -DENABLE_HARDENING:BOOL=ON `
            -DENABLE_INTERPROCEDURAL_OPTIMIZATION:BOOL=ON `
            -DENABLE_OPENMP:BOOL=OFF `
            -DOUTPUT_TIME_AND_POSITIONS:BOOL=OFF `
            -DSEED_RANDOM_NUMBER_GENERATOR:BOOL=OFF `
            -DWARNINGS_AS_ERRORS:BOOL=ON `
            --warn-uninitialized `
            ..
          cmake --build . --config Release
          ctest . --build-config Release --repeat after-timeout:3
          cmake --install .
          cpack -C Release -G ZIP
          cpack -C Release -G ZIP --config CPackSourceConfig.cmake
        shell: pwsh

