# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: coverage

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: debian ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: setup
        run: |
          apt-get -qq -o APT::Acquire::Retries=4 update \
            || (sleep 15; apt-get -qq -o APT::Acquire::Retries=4 update)
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
              --no-install-recommends install \
            ca-certificates \
            g++ \
            gcovr \
            git \
            meson \
            ninja-build \
            pkgconf \
            python3
          apt-get -qq -o Dpkg::Use-Pty=0 autoremove
          rm -rf /var/lib/apt/lists/*
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: setup build
        run: |
          meson setup \
            -Db_coverage=true \
            -Db_lto=false \
            -Dbuildtype=debug \
            -Dopenmp=disabled \
            -Dwerror=true \
            _build
        shell: bash
      - name: build
        run: |
          ninja -C _build
        shell: bash
      - name: test
        run: |
          meson test -C _build --print-errorlogs
        shell: bash
      - name: coverage-xml
        run: |
          ninja -C _build coverage-xml
        shell: bash
      - name: summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse('_build/meson-logs/coverage.xml').getroot()
          lr = float(root.get('line-rate', 0))
          lc = int(root.get('lines-covered', 0))
          lv = int(root.get('lines-valid', 0))
          br = float(root.get('branch-rate', 0))
          bc = int(root.get('branches-covered', 0))
          bv = int(root.get('branches-valid', 0))
          print('## Coverage')
          print()
          print('| Metric | Covered | Total | Rate |')
          print('|--------|---------|-------|------|')
          print(f'| Lines | {lc} | {lv} | {lr:.1%} |')
          if bv > 0:
              print(f'| Branches | {bc} | {bv} | {br:.1%} |')
          EOF
        shell: bash
      - name: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.arch }}
          path: _build/meson-logs/coverage.xml
          retention-days: 1
          if-no-files-found: ignore

  merge:
    name: merge
    needs: coverage
    runs-on: ubuntu-24.04-arm
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - name: setup
        run: |
          apt-get -qq -o APT::Acquire::Retries=4 update \
            || (sleep 15; apt-get -qq -o APT::Acquire::Retries=4 update)
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
              --no-install-recommends install gcovr
          apt-get -qq -o Dpkg::Use-Pty=0 autoremove
          rm -rf /var/lib/apt/lists/*
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
      - name: download amd64
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-xml-amd64
          path: coverage-xml-amd64
      - name: download arm64
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage-xml-arm64
          path: coverage-xml-arm64
      - name: merge
        run: |
          GCOVR_ARGS=()
          if [ -s coverage-xml-amd64/coverage.xml ]; then
            GCOVR_ARGS+=(--cobertura-add-tracefile coverage-xml-amd64/coverage.xml)
          fi
          if [ -s coverage-xml-arm64/coverage.xml ]; then
            GCOVR_ARGS+=(--cobertura-add-tracefile coverage-xml-arm64/coverage.xml)
          fi
          if [ ${#GCOVR_ARGS[@]} -gt 0 ]; then
            gcovr "${GCOVR_ARGS[@]}" --xml coverage.xml
          else
            echo 'coverage.xml files could not be found' >&2
            exit 1
          fi
        shell: bash
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: publish to deepsource
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: deepsourcelabs/test-coverage-action@master
        with:
          key: cxx
          coverage-file: coverage.xml
          dsn: ${{ secrets.DEEPSOURCE_DSN }}
