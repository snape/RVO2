---
name: bazel

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel-almalinux:
    name: bazel almalinux amd64
    runs-on: ubuntu-latest
    container: almalinux:10
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          dnf makecache -q --refresh || (sleep 15; dnf makecache -q --refresh)
          dnf install -q -y \
            ca-certificates \
            git \
            glibc-devel \
            wget \
            which
          dnf clean all
          rm -rf /var/cache/yum
          wget -qO /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: bash

  bazel-alpine:
    name: bazel alpine linux amd64
    runs-on: ubuntu-latest
    container: alpine:3
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" \
            >> /etc/apk/repositories
          apk add --no-cache \
            bazel8 \
            ca-certificates \
            git
        shell: sh
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('MODULE.bazel', '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --config=alpine \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: sh

  bazel-arch:
    name: bazel arch linux amd64
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          pacman --needed --noconfirm --noprogressbar -Sy \
            ca-certificates \
            git \
            wget \
            which
          rm -rf \
            /var/cache/pacman/pkg/* \
            /var/lib/pacman/sync/*
          wget -qO /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: bash

  bazel-fedora:
    name: bazel fedora linux amd64
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          dnf makecache -q --refresh || (sleep 15; dnf makecache -q --refresh)
          dnf install -q -y \
            ca-certificates \
            git \
            glibc-devel \
            wget \
            which
          dnf clean all
          rm -rf /var/cache/yum
          wget -qO /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: bash

  bazel-macos:
    name: bazel macos arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-brew-${{
            hashFiles('Brewfile') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-brew-
      - name: setup
        run: |
          brew update -q || (sleep 15; brew update -q)
          brew bundle install -q
          brew cleanup -q -s
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        shell: zsh -efuo pipefail {0}
      - name: cache bazel
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/Library/Caches/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: zsh -efuo pipefail {0}

  bazel-macos-x86_64:
    name: bazel macos x86_64
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-brew-${{
            hashFiles('Brewfile') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-brew-
      - name: setup
        run: |
          brew update -q || (sleep 15; brew update -q)
          brew bundle install -q
          brew cleanup -q -s
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        shell: zsh -efuo pipefail {0}
      - name: cache bazel
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/Library/Caches/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: zsh -efuo pipefail {0}

  bazel-opensuse:
    name: bazel opensuse leap amd64
    runs-on: ubuntu-latest
    container: opensuse/leap:16.0
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          zypper -n -q ref || (sleep 15; zypper -n -q ref)
          zypper -n -q in --no-recommends \
            ca-certificates \
            git \
            glibc-devel \
            wget \
            which
          zypper -n -q cc -a
          wget -qO /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: bash

  bazel-ubuntu:
    name: bazel ubuntu amd64
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          apt-get -qq -o APT::Acquire::Retries=4 update \
            || (sleep 15; apt-get -qq -o APT::Acquire::Retries=4 update)
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
              --no-install-recommends install \
            ca-certificates \
            g++ \
            git \
            wget
          apt-get -qq -o Dpkg::Use-Pty=0 autoremove
          rm -rf /var/lib/apt/lists/*
          wget -q \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-amd64.deb
          dpkg -i bazelisk-amd64.deb
          rm -rf bazelisk-amd64.deb
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: bash

  bazel-ubuntu-arm64:
    name: bazel ubuntu arm64
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          apt-get -qq -o APT::Acquire::Retries=4 update \
            || (sleep 15; apt-get -qq -o APT::Acquire::Retries=4 update)
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
              --no-install-recommends install \
            ca-certificates \
            g++ \
            git \
            wget
          apt-get -qq -o Dpkg::Use-Pty=0 autoremove
          rm -rf /var/lib/apt/lists/*
          wget -q \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-arm64.deb
          dpkg -i bazelisk-arm64.deb
          rm -rf bazelisk-arm64.deb
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test \
            --features=treat_warnings_as_errors \
            --flaky_test_attempts=3 \
            ...
        shell: bash

  bazel-windows:
    name: bazel windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: cache winget
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\Microsoft\WinGet\Links
            ~\AppData\Local\Microsoft\WinGet\SourceData
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-winget-${{
            hashFiles('.github/workflows/*.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-winget-
      - name: setup
        run: |
          winget install -e --accept-package-agreements `
            --accept-source-agreements --id Git.Git
          winget install -e -r bazel --accept-package-agreements `
            --accept-source-agreements --id Bazel.Bazelisk
          Add-Content $env:GITHUB_PATH (
            [System.Environment]::GetEnvironmentVariable("Path", "Machine") + `
            ";" + [System.Environment]::GetEnvironmentVariable("Path", "User"))
        shell: pwsh
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache bazel
        uses: actions/cache@v5
        with:
          path: |
            ~\_bazel_RUNNERADMIN
            ~\AppData\Local\bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test `
            --features=treat_warnings_as_errors `
            --flaky_test_attempts=3 `
            ...
        shell: pwsh

  bazel-windows-arm64:
    name: bazel windows arm64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: cache winget
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\Microsoft\WinGet\Links
            ~\AppData\Local\Microsoft\WinGet\SourceData
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-winget-${{
            hashFiles('.github/workflows/*.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-winget-
      - name: setup
        run: |
          Install-Module -Force -Name Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Force -Latest
          winget install -e --accept-package-agreements `
            --accept-source-agreements --id Git.Git
          winget install -e -r bazel --accept-package-agreements `
            --accept-source-agreements --id Bazel.Bazelisk
          Add-Content $env:GITHUB_PATH (
            [System.Environment]::GetEnvironmentVariable("Path", "Machine") + `
            ";" + [System.Environment]::GetEnvironmentVariable("Path", "User"))
        shell: pwsh
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: cache bazel
        uses: actions/cache@v5
        with:
          path: |
            ~\_bazel_RUNNERADMIN
            ~\AppData\Local\bazelisk
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-bazel-${{
            hashFiles('.bazelversion', 'MODULE.bazel',
            '**/*.bazel', '**/*.bzl') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build test package
        run: |
          bazel test `
            --features=treat_warnings_as_errors `
            --flaky_test_attempts=3 `
            ...
        shell: pwsh
